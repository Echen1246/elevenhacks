<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workday × ElevenLabs — Wireframes</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
<style>
  body { margin: 0; background: #ececec; font-family: "Geist", sans-serif; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<!-- shared bits -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="voice-bar.jsx"></script>
<script type="text/babel" src="voice-states.jsx"></script>

<!-- variations -->
<script type="text/babel" src="v1-brutalist.jsx"></script>
<script type="text/babel" src="v2-editorial.jsx"></script>
<script type="text/babel" src="v3-sketchy.jsx"></script>
<script type="text/babel" src="v4-terminal.jsx"></script>

<script type="text/babel" data-presets="react">
const TWEAKS = /*EDITMODE-BEGIN*/{
  "showVoiceStates": true,
  "showAnnotations": true
}/*EDITMODE-END*/;

const App = () => {
  const t = useTweaks(TWEAKS);
  const setTweak = t.setTweak;

  return (
    <>
      <DesignCanvas>
        <DCSection id="homes" title="Home page — 4 directions">
          <DCArtboard id="v1" label="01 · Brutalist Grid (mid-fi)" width={1280} height={820}>
            <V1Brutalist/>
          </DCArtboard>
          <DCArtboard id="v2" label="02 · Swiss Editorial (mid-fi)" width={1280} height={820}>
            <V2Editorial/>
          </DCArtboard>
          <DCArtboard id="v3" label="03 · Lo-fi Sketch" width={1280} height={820}>
            <V3Sketchy/>
          </DCArtboard>
          <DCArtboard id="v4" label="04 · Terminal / Voice-first" width={1280} height={820}>
            <V4Terminal/>
          </DCArtboard>
        </DCSection>

        {t.showVoiceStates && (
          <DCSection id="voice" title="Voice bar — listening state progression">
            <DCArtboard id="states" label="Listening flow (4 frames)" width={1280} height={600}>
              <VoiceListeningStates/>
            </DCArtboard>
          </DCSection>
        )}
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Display">
          <TweakToggle label="Show voice state frames" value={t.showVoiceStates} onChange={v => setTweak('showVoiceStates', v)}/>
          <TweakToggle label="Show annotations" value={t.showAnnotations} onChange={v => setTweak('showAnnotations', v)}/>
        </TweakSection>
        <TweakSection title="Notes">
          <div style={{ fontSize: 12, color: '#666', lineHeight: 1.5, padding: '4px 0' }}>
            Drag artboards to reorder. Click any to focus fullscreen. Each variation = a different aesthetic + density direction.
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
